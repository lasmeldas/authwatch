<svg xmlns="http://www.w3.org/2000/svg" width="869" height="498" viewBox="0 0 869 498" role="img" aria-label="authwatch">
  <rect x="0.5" y="0.5" width="868" height="497" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 38H868.5" stroke="#30363d"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="434.5" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94a3b8">authwatch</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
  <text x="24" y="64" xml:space="preserve"><tspan fill="#00ffa3" font-weight="700">$ </tspan><tspan fill="#e2e8f0">authwatch samples/auth.log --year 2026</tspan></text><text x="24" y="85" xml:space="preserve"><tspan fill="#38bdf8">Parsed</tspan><tspan fill="#e2e8f0"> 25 login events: 22 failed, 3 accepted, from 5 IP addresses.</tspan></text><text x="24" y="106" xml:space="preserve"><tspan fill="#38bdf8">Most targeted</tspan><tspan fill="#e2e8f0"> usernames: root (7), admin (2), ubuntu (2), guest (2), alice (2)</tspan></text><text x="24" y="127" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="24" y="148" xml:space="preserve"><tspan fill="#38bdf8">3 alert(s):</tspan></text><text x="24" y="169" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="24" y="190" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">[CRITICAL]</tspan><tspan fill="#e2e8f0"> success_after_failures from 203.0.113.45</tspan></text><text x="24" y="211" xml:space="preserve"><tspan fill="#94a3b8">    Login as 'ubuntu' succeeded after 7 failures within 300s. Treat the account as possibly compromised.</tspan></text><text x="24" y="232" xml:space="preserve"><tspan fill="#94a3b8">    Nov 08 03:12:01 -&gt; Nov 08 03:12:19 | usernames: admin, oracle, root, test, ubuntu</tspan></text><text x="24" y="253" xml:space="preserve"><tspan fill="#ffb86c" font-weight="700">[HIGH]</tspan><tspan fill="#e2e8f0"> brute_force from 198.51.100.23</tspan></text><text x="24" y="274" xml:space="preserve"><tspan fill="#94a3b8">    8 failed logins within 300s.</tspan></text><text x="24" y="295" xml:space="preserve"><tspan fill="#94a3b8">    Nov 08 14:20:01 -&gt; Nov 08 14:20:40 | usernames: admin, guest, postgres, root</tspan></text><text x="24" y="316" xml:space="preserve"><tspan fill="#f1fa8c" font-weight="700">[MEDIUM]</tspan><tspan fill="#e2e8f0"> username_spray from 198.51.100.99</tspan></text><text x="24" y="337" xml:space="preserve"><tspan fill="#94a3b8">    5 failed logins spread over 5 different usernames (slow spray, stays under the burst threshold).</tspan></text><text x="24" y="358" xml:space="preserve"><tspan fill="#94a3b8">    Nov 08 09:00:12 -&gt; Nov 08 09:40:02 | usernames: ftpuser, git, guest, jenkins, nagios</tspan></text><text x="24" y="379" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="24" y="400" xml:space="preserve"><tspan fill="#00ffa3" font-weight="700">$ </tspan><tspan fill="#e2e8f0">authwatch samples/auth.log --year 2026 --ips-only</tspan></text><text x="24" y="421" xml:space="preserve"><tspan fill="#e2e8f0">203.0.113.45</tspan></text><text x="24" y="442" xml:space="preserve"><tspan fill="#e2e8f0">198.51.100.23</tspan></text><text x="24" y="463" xml:space="preserve"><tspan fill="#e2e8f0">198.51.100.99</tspan></text>
  </g>
</svg>
