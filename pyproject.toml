[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "authwatch"
version = "0.2.0"
description = "Detect SSH brute-force attacks in auth logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lasmeldas" }]
keywords = ["security", "ssh", "brute-force", "log-analysis", "blue-team"]

[project.scripts]
authwatch = "authwatch.cli:main"

[tool.setuptools]
packages = ["authwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
